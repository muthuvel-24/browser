# Application Configuration
server.port=8080
spring.application.name=muthu-search-service

# PostgreSQL + pgvector Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:muthu_search}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Crawler Politeness
crawler.politeness.delay-ms=1000
crawler.max-depth=2
crawler.user-agent=MuthuBrowserBot/1.0 (+https://github.com/muthuvel-24/browser)

# AI Embedding Service Configuration
ai.llm.provider=${AI_PROVIDER:ollama}
ai.llm.endpoint=${AI_ENDPOINT:http://localhost:11434}
ai.embedding.model=${EMBEDDING_MODEL:nomic-embed-text}
