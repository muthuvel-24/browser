# Application Configuration
server.address=127.0.0.1
server.port=8080
spring.application.name=muthu-search-service

# Security & Crawler Configuration
crawler.api.secret-key=${CRAWLER_SECRET_KEY:muthu-local-secret-crawler-key}
crawler.politeness.delay-ms=1000
crawler.max-depth=2
crawler.user-agent=MuthuBrowserBot/1.0 (+https://github.com/muthuvel-24/browser)

# PostgreSQL + pgvector Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:muthu_search}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AI Embedding Service Configuration
ai.llm.provider=${AI_PROVIDER:ollama}
ai.llm.endpoint=${AI_ENDPOINT:http://127.0.0.1:11434}
ai.embedding.model=${EMBEDDING_MODEL:nomic-embed-text}
